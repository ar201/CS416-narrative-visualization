<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Warming Planet | Narrative Visualization</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-svg-annotation@2.5.1/d3-annotation.min.js"></script>
<style>
  :root{
    --bg:#0f1420;
    --panel:#161d2e;
    --ink:#eef1f8;
    --muted:#9aa4b8;
    --accent:#ff6b4a;
    --accent2:#5ec8ff;
    --line:#2a3348;
    --good:#4ade80;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;}
  #app{max-width:980px;margin:0 auto;padding:28px 20px 60px;}
  header{margin-bottom:6px;}
  header h1{font-size:1.6rem;margin:0 0 4px;font-weight:700;letter-spacing:-0.01em;}
  header p.sub{color:var(--muted);margin:0;font-size:0.95rem;}

  #progress{display:flex;gap:8px;margin:18px 0 6px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;
       transition:background .2s;}
  .dot.active{background:var(--accent);}
  .dot.done{background:var(--accent2);}

  #scene-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 8px;margin-top:10px;}
  #scene-title{font-size:1.15rem;font-weight:700;margin:0 0 2px;}
  #scene-caption{color:var(--muted);font-size:0.92rem;margin:0 0 10px;line-height:1.4;max-width:640px;}

  svg{display:block;}
  .axis path,.axis line{stroke:var(--line);}
  .axis text{fill:var(--muted);font-size:11px;}
  .gridline{stroke:var(--line);stroke-opacity:0.5;}
  .zero-line{stroke:#5a6480;stroke-dasharray:4 3;}
  .anomaly-line{fill:none;stroke:var(--accent2);stroke-width:2.2px;}
  .anomaly-area{fill:var(--accent2);opacity:0.08;}
  .dot-point{fill:var(--accent2);stroke:var(--panel);stroke-width:1px;}
  .dot-point.hover{fill:var(--accent);r:5;}
  .dot-point.hot{fill:var(--accent);}
  .annotation-note-title{fill:var(--ink) !important;font-weight:700 !important;}
  .annotation-note-label{fill:var(--muted) !important;}
  .annotation-note-bg{fill:#1e2740;opacity:0.94;}
  .annotation path{stroke:var(--accent);}

  #controls{display:flex;justify-content:space-between;align-items:center;
    margin-top:14px;padding:12px 4px 18px;}
  button.nav{background:var(--accent);color:#161d2e;border:none;border-radius:8px;
    padding:9px 18px;font-weight:700;font-size:0.9rem;cursor:pointer;}
  button.nav:disabled{opacity:0.35;cursor:not-allowed;}
  button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}

  #explore-controls{display:none;gap:8px;flex-wrap:wrap;margin:4px 0 14px;}
  #explore-controls button{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    padding:6px 12px;border-radius:20px;font-size:0.82rem;cursor:pointer;}
  #explore-controls button.active{background:var(--accent2);color:#0f1420;border-color:var(--accent2);font-weight:700;}

  #tooltip{position:absolute;pointer-events:none;background:#1e2740;border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:0.8rem;color:var(--ink);opacity:0;
    transition:opacity .1s;box-shadow:0 4px 14px rgba(0,0,0,0.4);}
  #tooltip b{color:var(--accent2);}

  footer{margin-top:10px;color:var(--muted);font-size:0.78rem;text-align:center;}
  a{color:var(--accent2);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>A Warming Planet</h1>
    <p class="sub">Global surface temperature anomaly, 1880&ndash;2024 (&deg;C relative to the 1951&ndash;1980 average)</p>
  </header>

  <div id="progress"></div>

  <div id="scene-panel">
    <h2 id="scene-title"></h2>
    <p id="scene-caption"></p>
    <div id="explore-controls"></div>
    <svg id="chart" width="920" height="460"></svg>
  </div>

  <div id="controls">
    <button class="nav secondary" id="btnBack">&larr; Back</button>
    <span id="scene-indicator" style="color:var(--muted);font-size:0.82rem;"></span>
    <button class="nav" id="btnNext">Next &rarr;</button>
  </div>

  <footer>Data: illustrative reconstruction in the pattern of NASA GISTEMP global annual mean anomalies. Built with D3.js v7 and d3-annotation.</footer>
</div>
<div id="tooltip"></div>

<script>
/* =========================================================================
   DATA
   ========================================================================= */
const DATA = [{y:1880,a:-0.17},{y:1881,a:-0.23},{y:1882,a:-0.21},{y:1883,a:-0.23},{y:1884,a:-0.17},{y:1885,a:-0.19},{y:1886,a:-0.17},{y:1887,a:-0.28},{y:1888,a:-0.24},{y:1889,a:-0.3},{y:1890,a:-0.28},{y:1891,a:-0.23},{y:1892,a:-0.27},{y:1893,a:-0.24},{y:1894,a:-0.16},{y:1895,a:-0.16},{y:1896,a:-0.18},{y:1897,a:-0.12},{y:1898,a:-0.08},{y:1899,a:-0.16},{y:1900,a:-0.04},{y:1901,a:-0.07},{y:1902,a:-0.13},{y:1903,a:-0.16},{y:1904,a:-0.08},{y:1905,a:-0.16},{y:1906,a:-0.21},{y:1907,a:-0.22},{y:1908,a:-0.14},{y:1909,a:-0.18},{y:1910,a:-0.17},{y:1911,a:-0.19},{y:1912,a:-0.22},{y:1913,a:-0.17},{y:1914,a:-0.25},{y:1915,a:-0.23},{y:1916,a:-0.21},{y:1917,a:-0.24},{y:1918,a:-0.21},{y:1919,a:-0.25},{y:1920,a:-0.25},{y:1921,a:-0.31},{y:1922,a:-0.27},{y:1923,a:-0.24},{y:1924,a:-0.25},{y:1925,a:-0.21},{y:1926,a:-0.21},{y:1927,a:-0.17},{y:1928,a:-0.11},{y:1929,a:-0.12},{y:1930,a:-0.11},{y:1931,a:-0.1},{y:1932,a:-0.07},{y:1933,a:0.03},{y:1934,a:0.02},{y:1935,a:0.03},{y:1936,a:0.0},{y:1937,a:0.09},{y:1938,a:0.05},{y:1939,a:0.09},{y:1940,a:0.19},{y:1941,a:0.12},{y:1942,a:0.08},{y:1943,a:0.06},{y:1944,a:0.05},{y:1945,a:0.01},{y:1946,a:-0.08},{y:1947,a:-0.14},{y:1948,a:-0.13},{y:1949,a:-0.17},{y:1950,a:-0.2},{y:1951,a:-0.1},{y:1952,a:-0.1},{y:1953,a:-0.15},{y:1954,a:-0.1},{y:1955,a:-0.11},{y:1956,a:-0.04},{y:1957,a:-0.08},{y:1958,a:-0.09},{y:1959,a:-0.07},{y:1960,a:-0.02},{y:1961,a:-0.05},{y:1962,a:-0.01},{y:1963,a:0.04},{y:1964,a:-0.02},{y:1965,a:-0.03},{y:1966,a:0.07},{y:1967,a:0.01},{y:1968,a:-0.03},{y:1969,a:-0.03},{y:1970,a:-0.02},{y:1971,a:0.04},{y:1972,a:0.05},{y:1973,a:-0.0},{y:1974,a:-0.05},{y:1975,a:-0.02},{y:1976,a:0.1},{y:1977,a:0.1},{y:1978,a:0.21},{y:1979,a:0.25},{y:1980,a:0.2},{y:1981,a:0.26},{y:1982,a:0.22},{y:1983,a:0.17},{y:1984,a:0.11},{y:1985,a:0.13},{y:1986,a:0.13},{y:1987,a:0.24},{y:1988,a:0.32},{y:1989,a:0.44},{y:1990,a:0.5},{y:1991,a:0.42},{y:1992,a:0.45},{y:1993,a:0.41},{y:1994,a:0.49},{y:1995,a:0.48},{y:1996,a:0.41},{y:1997,a:0.45},{y:1998,a:0.44},{y:1999,a:0.38},{y:2000,a:0.45},{y:2001,a:0.48},{y:2002,a:0.56},{y:2003,a:0.58},{y:2004,a:0.57},{y:2005,a:0.66},{y:2006,a:0.63},{y:2007,a:0.75},{y:2008,a:0.75},{y:2009,a:0.75},{y:2010,a:0.7},{y:2011,a:0.7},{y:2012,a:0.84},{y:2013,a:0.88},{y:2014,a:0.81},{y:2015,a:0.9},{y:2016,a:0.99},{y:2017,a:0.95},{y:2018,a:0.88},{y:2019,a:0.94},{y:2020,a:1.02},{y:2021,a:0.86},{y:2022,a:0.86},{y:2023,a:1.17},{y:2024,a:1.28}];

/* =========================================================================
   PARAMETERS  (state variables that drive every scene)
   ========================================================================= */
const state = {
  currentScene: 0,          // 0,1,2  -- controls which scene is rendered
  sceneCount: 3,
  activeDecadeFilter: null, // used only in scene 2 (free exploration)
  hoveredYear: null         // used only in scene 2 (tooltip trigger)
};

const SCENES = [
  {
    title: "1880\u20132024: A century and a half of warming",
    caption: "The overview: since global record-keeping began, Earth's average surface temperature has risen by more than a full degree Celsius. Annotations mark the moments that define the story. (Exploration is disabled here \u2014 just read the shape of the trend.)"
  },
  {
    title: "The last 55 years: warming accelerates",
    caption: "Zooming into 1970\u20132024 shows what the first scene only hinted at: the rate of warming itself has increased, especially after international climate diplomacy began in earnest. (Still no exploration \u2014 focus on the acceleration.)"
  },
  {
    title: "Explore the record yourself",
    caption: "Now it's your turn. Hover any point for its exact value, and use the decade filters below to isolate different eras of the record."
  }
];

/* =========================================================================
   SVG / SCALES  (shared visual template for consistency across scenes)
   ========================================================================= */
const svg = d3.select("#chart");
const margin = {top: 30, right: 40, bottom: 40, left: 55};
const width = +svg.attr("width") - margin.left - margin.right;
const height = +svg.attr("height") - margin.top - margin.bottom;

const root = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const gGrid = root.append("g").attr("class","grid-layer");
const gAxes = root.append("g").attr("class","axes-layer");
const gData = root.append("g").attr("class","data-layer");
const gAnno = root.append("g").attr("class","anno-layer");

const tooltip = d3.select("#tooltip");

/* =========================================================================
   HELPERS
   ========================================================================= */
function clearLayers(){
  gGrid.selectAll("*").remove();
  gAxes.selectAll("*").remove();
  gData.selectAll("*").remove();
  gAnno.selectAll("*").remove();
}

function drawAxes(x, y){
  gGrid.append("g")
    .attr("class","gridline-group")
    .selectAll("line")
    .data(y.ticks(6))
    .join("line")
      .attr("class","gridline")
      .attr("x1",0).attr("x2",width)
      .attr("y1", d=>y(d)).attr("y2", d=>y(d));

  gAxes.append("g")
    .attr("class","axis x-axis")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x).tickFormat(d3.format("d")).ticks(10));

  gAxes.append("g")
    .attr("class","axis y-axis")
    .call(d3.axisLeft(y).ticks(6).tickFormat(d=>(d>0?"+":"")+d.toFixed(1)+"\u00b0"));

  gAxes.append("line")
    .attr("class","zero-line")
    .attr("x1",0).attr("x2",width)
    .attr("y1", y(0)).attr("y2", y(0));
}

function lineFor(x,y){
  return d3.line().x(d=>x(d.y)).y(d=>y(d.a)).curve(d3.curveMonotoneX);
}

function areaFor(x,y){
  return d3.area().x(d=>x(d.y)).y0(y(0)).y1(d=>y(d.a)).curve(d3.curveMonotoneX);
}

// Consistent annotation template used in every scene
function addAnnotations(annotations){
  const makeAnnotations = d3.annotation()
    .type(d3.annotationLabel)
    .annotations(annotations);
  gAnno.append("g").attr("class","annotation-group").call(makeAnnotations);
}

function updateProgress(){
  const dots = d3.select("#progress").selectAll(".dot").data(d3.range(state.sceneCount));
  dots.join("div")
    .attr("class", i => "dot" + (i===state.currentScene ? " active" : i<state.currentScene ? " done":""))
    .on("click", (event,i) => { state.currentScene = i; render(); });
  d3.select("#scene-indicator").text(`Scene ${state.currentScene+1} of ${state.sceneCount}`);
  d3.select("#btnBack").attr("disabled", state.currentScene===0 ? true : null);
  d3.select("#btnNext").text(state.currentScene===state.sceneCount-1 ? "Restart \u21bb" : "Next \u2192");
}

/* =========================================================================
   SCENE 0 — Full overview, annotated, NO interaction (martini-glass stem)
   ========================================================================= */
function renderScene0(){
  const x = d3.scaleLinear().domain(d3.extent(DATA, d=>d.y)).range([0, width]);
  const y = d3.scaleLinear().domain([-0.4, 1.4]).range([height, 0]);

  drawAxes(x,y);

  gData.append("path").datum(DATA).attr("class","anomaly-area").attr("d", areaFor(x,y));
  gData.append("path").datum(DATA).attr("class","anomaly-line").attr("d", lineFor(x,y));

  const annoData = [
    {yr:1880, val:-0.17, dx:40, dy:-40, title:"Record begins", label:"Modern instrumental record starts in 1880."},
    {yr:1988, val:0.32, dx:0, dy:-60, title:"1988: Warning to Congress", label:"NASA scientist James Hansen testifies that human-caused warming has begun."},
    {yr:2016, val:0.99, dx:20, dy:-55, title:"2016: First +1.0\u00b0C year", label:"The first calendar year to exceed one full degree above baseline."},
    {yr:2024, val:1.28, dx:-90, dy:-40, title:"2023\u20132024: Hottest on record", label:"The two warmest years ever measured, back to back."}
  ].map(d => ({
    note:{title:d.title, label:d.label, wrap:170},
    x:x(d.yr), y:y(d.val), dx:d.dx, dy:d.dy, subject:{radius:5}
  }));

  addAnnotations(annoData);

  // highlight the annotated points without allowing hover interaction
  gData.selectAll(".dot-point")
    .data([1880,1988,2016,2024].map(yr => DATA.find(d=>d.y===yr)))
    .join("circle")
      .attr("class","dot-point hot")
      .attr("cx", d=>x(d.y)).attr("cy", d=>y(d.a)).attr("r",4);
}

/* =========================================================================
   SCENE 1 — Zoom to 1970-2024, annotated, still NO interaction
   ========================================================================= */
function renderScene1(){
  const recent = DATA.filter(d => d.y >= 1970);
  const x = d3.scaleLinear().domain(d3.extent(recent, d=>d.y)).range([0, width]);
  const y = d3.scaleLinear().domain([-0.1, 1.4]).range([height, 0]);

  drawAxes(x,y);

  gData.append("path").datum(recent).attr("class","anomaly-area").attr("d", areaFor(x,y));
  gData.append("path").datum(recent).attr("class","anomaly-line").attr("d", lineFor(x,y));

  // simple linear trend line to visualize acceleration
  const reg = linearRegression(recent);
  const trendData = [recent[0].y, recent[recent.length-1].y].map(yr => ({y:yr, a: reg.slope*yr + reg.intercept}));
  gData.append("path")
    .datum(trendData)
    .attr("class","anomaly-line")
    .attr("stroke", "#ff6b4a")
    .attr("stroke-dasharray","5 4")
    .attr("d", d3.line().x(d=>x(d.y)).y(d=>y(d.a)));

  const annoData = [
    {yr:1988, val:0.32, dx:20, dy:-70, title:"1988", label:"Public climate testimony begins the modern policy era."},
    {yr:1997, val:0.45, dx:-40, dy:60, title:"1997: Kyoto Protocol", label:"First major international treaty to limit emissions."},
    {yr:2015, val:0.90, dx:10, dy:-70, title:"2015: Paris Agreement", label:"196 parties agree to hold warming well below 2\u00b0C."},
    {yr:2024, val:1.28, dx:-110, dy:-30, title:"Trend is accelerating", label:"The dashed line shows the average rate of rise \u2014 recent years sit above it."}
  ].map(d => ({
    note:{title:d.title, label:d.label, wrap:170},
    x:x(d.yr), y:y(d.val), dx:d.dx, dy:d.dy, subject:{radius:5}
  }));

  addAnnotations(annoData);

  gData.selectAll(".dot-point")
    .data([1988,1997,2015,2024].map(yr => recent.find(d=>d.y===yr)))
    .join("circle")
      .attr("class","dot-point hot")
      .attr("cx", d=>x(d.y)).attr("cy", d=>y(d.a)).attr("r",4);
}

function linearRegression(data){
  const n = data.length;
  const sumX = d3.sum(data, d=>d.y);
  const sumY = d3.sum(data, d=>d.a);
  const sumXY = d3.sum(data, d=>d.y*d.a);
  const sumX2 = d3.sum(data, d=>d.y*d.y);
  const slope = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);
  const intercept = (sumY - slope*sumX) / n;
  return {slope, intercept};
}

/* =========================================================================
   SCENE 2 — Free exploration (the open "bowl" of the martini glass)
   Triggers: decade-filter buttons + hover tooltips, both update state
   ========================================================================= */
const DECADES = ["All", "1880s\u20131920s", "1930s\u20131960s", "1970s\u20131990s", "2000s\u2013Present"];
const DECADE_RANGES = {
  "All": [1880,2024],
  "1880s\u20131920s": [1880,1929],
  "1930s\u20131960s": [1930,1969],
  "1970s\u20131990s": [1970,1999],
  "2000s\u2013Present": [2000,2024]
};

function renderScene2(){
  d3.select("#explore-controls").style("display","flex");
  const controls = d3.select("#explore-controls").selectAll("button").data(DECADES);
  controls.join("button")
    .text(d=>d)
    .attr("class", d => "filter-btn" + ((state.activeDecadeFilter||"All")===d ? " active":""))
    .on("click", (event,d) => {
      state.activeDecadeFilter = d;
      drawScene2Chart();
      d3.select("#explore-controls").selectAll("button")
        .attr("class", dd => "filter-btn" + (dd===d ? " active":""));
    });

  drawScene2Chart();
}

function drawScene2Chart(){
  gGrid.selectAll("*").remove();
  gAxes.selectAll("*").remove();
  gData.selectAll("*").remove();
  gAnno.selectAll("*").remove();

  const filterKey = state.activeDecadeFilter || "All";
  const [lo,hi] = DECADE_RANGES[filterKey];
  const filtered = DATA.filter(d => d.y>=lo && d.y<=hi);

  const x = d3.scaleLinear().domain([lo,hi]).range([0, width]);
  const y = d3.scaleLinear().domain([-0.4, 1.4]).range([height, 0]);

  drawAxes(x,y);

  gData.append("path").datum(filtered).attr("class","anomaly-area").attr("d", areaFor(x,y));
  gData.append("path").datum(filtered).attr("class","anomaly-line").attr("d", lineFor(x,y));

  gData.selectAll(".dot-point")
    .data(filtered)
    .join("circle")
      .attr("class", d => "dot-point" + (d.a>=1.0 ? " hot":""))
      .attr("cx", d=>x(d.y)).attr("cy", d=>y(d.a)).attr("r",3.2)
      .style("cursor","pointer")
      .on("mouseenter", function(event,d){
        state.hoveredYear = d.y;               // trigger updates parameter
        d3.select(this).attr("class","dot-point hover");
        tooltip.style("opacity",1)
          .html(`<b>${d.y}</b>: ${d.a>0?"+":""}${d.a.toFixed(2)}\u00b0C anomaly`);
      })
      .on("mousemove", function(event){
        const [mx,my] = d3.pointer(event, document.body);
        tooltip.style("left", (mx+14)+"px").style("top", (my-10)+"px");
      })
      .on("mouseleave", function(event,d){
        state.hoveredYear = null;
        d3.select(this).attr("class","dot-point" + (d.a>=1.0 ? " hot":""));
        tooltip.style("opacity",0);
      });

  // A light-touch persistent annotation reminding the user this scene is open-ended
  addAnnotations([{
    note:{title:"Hover to explore", label:"Every point is interactive. Try the decade filters above to compare eras.", wrap:190},
    x: x(filtered[Math.floor(filtered.length*0.15)].y),
    y: y(filtered[Math.floor(filtered.length*0.15)].a),
    dx: 30, dy: -60, subject:{radius:4}
  }]);
}

/* =========================================================================
   RENDER DISPATCH  (parameter -> scene template)
   ========================================================================= */
function render(){
  clearLayers();
  d3.select("#explore-controls").style("display","none").html("");
  d3.select("#scene-title").text(SCENES[state.currentScene].title);
  d3.select("#scene-caption").text(SCENES[state.currentScene].caption);

  if(state.currentScene===0) renderScene0();
  else if(state.currentScene===1) renderScene1();
  else renderScene2();

  updateProgress();
}

/* =========================================================================
   TRIGGERS — top-level navigation
   ========================================================================= */
d3.select("#btnNext").on("click", () => {
  state.currentScene = state.currentScene < state.sceneCount-1 ? state.currentScene+1 : 0;
  render();
});
d3.select("#btnBack").on("click", () => {
  if(state.currentScene>0){ state.currentScene -= 1; render(); }
});

render();
</script>
</body>
</html>
